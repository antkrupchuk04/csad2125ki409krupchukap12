name: CI Pipeline

on:
  push:
    branches:
      - develop
      - feature/develop/task4
  pull_request:
    branches:
      - develop

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          chmod +x ./CI/*
          ./CI/install.sh

          
      - name: Build images
        run: |
          # mkdir -p CI/
          chmod +xw ./CI/*
          ./CI/build.sh

      # TBD:
      #- name: Run tests
      #  run: |
      #    ./run_tests.sh
          
      - name: List files in build directory
        run: ls -al ./CI/build

      - name: Upload binaries and test reports
        uses: actions/upload-artifact@v3
        with:
          name: binaries-and-reports
          path: |
            ./CI/build/**
  
  generate-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Doxygen
      run: sudo apt update && sudo apt install doxygen graphviz -y

    - name: Generate Doxygen documentation
      run: doxygen Doxyfile

    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        force_orphan: true
      
